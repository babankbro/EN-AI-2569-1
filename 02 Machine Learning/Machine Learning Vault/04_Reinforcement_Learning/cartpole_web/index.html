<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CartPole Reinforcement Learning Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    <div class="quiz-container">
        <header>
            <h1><i class="fas fa-robot"></i> CartPole RL Quiz</h1>
            <p>ทดสอบความรู้ Reinforcement Learning (CartPole Case Study) 10 ข้อ</p>
        </header>
        <div id="quiz-body" class="quiz-body">
            <!-- Questions will be loaded here via JS -->
        </div>
        <div class="quiz-footer">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <p id="progress-text">ข้อ 1 / 10</p>
        </div>
    </div>
    
    <div id="result-modal" class="modal hidden">
        <div class="modal-content glass">
            <h2 id="result-title"></h2>
            <p id="result-score"></p>
            <button id="restart-btn" class="btn"><i class="fas fa-redo"></i> ทำแบบทดสอบอีกครั้ง</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
